<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación Especial</title>
    <style>
        /* Estilos generales */
        body {
            background-color: black;
            color: white;
            font-family: 'Harlow Solid Italic', cursive;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Fuente Harlow Solid Italic */
        @import url('https://fonts.googleapis.com/css2?family=Harlow+Solid+Italic&display=swap');

        /* Contenedor principal */
        .container {
            text-align: center;
            position: relative;
        }

        /* Texto principal */
        .main-text {
            font-size: 32px;
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeIn 2s forwards;
        }

        /* Animación de aparición del texto */
        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        /* Rosas */
        .rose {
            position: absolute;
            width: 100px;
            height: 100px;
            opacity: 0;
            animation: drawRose 5s forwards;
        }

        /* Animación de dibujo de la rosa */
        @keyframes drawRose {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        /* Posiciones de las rosas */
        .rose-1 {
            top: 10%;
            left: 10%;
            animation-delay: 1s;
        }

        .rose-2 {
            top: 10%;
            right: 10%;
            animation-delay: 2s;
        }

        .rose-3 {
            bottom: 10%;
            left: 10%;
            animation-delay: 3s;
        }

        /* Imagen */
        .image {
            width: 300px;
            border-radius: 10px;
            margin-top: 20px;
        }

        /* Texto adicional */
        .info {
            position: fixed;
            font-size: 20px;
        }

        .info-left {
            bottom: 20px;
            left: 20px;
        }

        .info-right {
            bottom: 20px;
            right: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Texto principal -->
        <div class="main-text" id="mainText">¿Quieres salir conmigo Isabellita?</div>

        <!-- Imagen -->
        <img src="https://stickerly.pstatic.net/sticker_pack/GKxNn91GyJYvRhMszE6eOQ/0TEYRQ/45/-939941299.png" alt="Imagen" class="image">

        <!-- Rosas -->
        <img src="https://www.21-draw.com/wp-content/uploads/2023/08/color-the-leaves-e1692607469362-1024x1020.jpg" alt="Rosa 1" class="rose rose-1">
        <img src="https://www.21-draw.com/wp-content/uploads/2023/08/color-the-leaves-e1692607469362-1024x1020.jpg" alt="Rosa 2" class="rose rose-2">
        <img src="https://www.21-draw.com/wp-content/uploads/2023/08/color-the-leaves-e1692607469362-1024x1020.jpg" alt="Rosa 3" class="rose rose-3">

        <!-- Texto adicional -->
        <div class="info info-left">Ubicación: Exposición de arte en Caracas</div>
        <div class="info info-right">Fecha: Este sábado (sujeto a cambios posiblemente)</div>
    </div>

    <!-- Script para animación del texto -->
    <script>
        // Función para simular la escritura en vivo
        function typeWriter(text, element, delay = 100) {
            let i = 0;
            const interval = setInterval(() => {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                } else {
                    clearInterval(interval);
                }
            }, delay);
        }

        // Aplicar la animación al texto principal
        const mainTextElement = document.getElementById("mainText");
        mainTextElement.innerHTML = ""; // Limpiar el texto inicial
        typeWriter("¿Quieres salir conmigo Isabellita?", mainTextElement, 100);
    </script>
</body>
</html>
